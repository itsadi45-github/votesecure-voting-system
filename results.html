<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteSecure - Election Results</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="results-page">
    <header class="top-bar" role="banner">
      <div class="top-bar-left">
        <a class="btn-back" id="backBtn" aria-label="Back" href="#">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div class="logo" aria-hidden="true">
          <i class="fa-solid fa-check-to-slot"></i>
          <span>VoteSecure</span>
        </div>
      </div>
    </header>

    <main class="main-content" role="main">
      <div id="resultsContent"></div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script>
    const Results = {
      electionId: '',
      election: null,
      candidates: [],

      init() {
        this.parseUrlParams();
        this.determineBackUrl();
        this.loadElection();
        this.render();
      },

      parseUrlParams() {
        const params = new URLSearchParams(window.location.search);
        this.electionId = params.get('election');
      },

      determineBackUrl() {
        const voterEmail = sessionStorage.getItem('voterEmail');
        this.backUrl = voterEmail ? 'voter-dashboard.html' : 'index.html';
      },

      loadElection() {
        this.election = DataStore.getElectionById(this.electionId);
        if (this.election) {
          this.candidates = DataStore.getElectionResults(this.electionId);
        }
      },

      render() {
        const container = document.getElementById('resultsContent');
        const backBtn = document.getElementById('backBtn');

        backBtn.setAttribute('href', this.backUrl);

        if (!this.election) {
          container.innerHTML = this.renderNotFound();
          return;
        }

        container.innerHTML = `
          <div class="results-header">
            <div class="results-header-main">
              <h1 class="results-title">${this.escapeHtml(this.election.title)}</h1>
              <p class="results-description">${this.escapeHtml(this.election.description)}</p>
            </div>
            <span class="badge ${this.election.status === 'ongoing' ? 'badge-ongoing' : 'badge-completed'}">
              ${this.election.status === 'ongoing' ? 'Ongoing - live count' : 'Completed'}
            </span>
          </div>

          <div class="stats-grid results-stats" role="region" aria-label="Election statistics">
            <article class="stat-card">
              <div class="stat-icon"><i class="fas fa-vote-yea" aria-hidden="true"></i></div>
              <div class="stat-content">
                <span class="stat-value" id="totalVotesStat">${this.getTotalVotes()}</span>
                <span class="stat-label">Total Votes Cast</span>
              </div>
            </article>
            <article class="stat-card">
              <div class="stat-icon"><i class="fas fa-users" aria-hidden="true"></i></div>
              <div class="stat-content">
                <span class="stat-value">${this.candidates.length}</span>
                <span class="stat-label">Number of Candidates</span>
              </div>
            </article>
            <article class="stat-card">
              <div class="stat-icon ${this.election.status === 'completed' ? 'verified' : ''}">
                <i class="fas ${this.election.status === 'completed' ? 'fa-trophy' : 'fa-user-check'}" aria-hidden="true"></i>
              </div>
              <div class="stat-content">
                <span class="stat-value">${this.escapeHtml(this.getLeadingCandidateName())}</span>
                <span class="stat-label">${this.election.status === 'completed' ? 'Winner' : 'Leading Candidate'}</span>
              </div>
            </article>
          </div>

          <section class="vote-count-section" aria-labelledby="voteCountTitle">
            <h2 class="section-title" id="voteCountTitle"><i class="fas fa-chart-bar" aria-hidden="true"></i> Vote Count</h2>
            ${this.candidates.length === 0
              ? '<p class="empty-message">No candidates found for this election.</p>'
              : this.renderCandidatesList()
            }
          </section>
        `;

        this.animateBars();
      },

      renderNotFound() {
        return `
          <div class="result-screen error">
            <div class="result-icon" aria-hidden="true"><i class="fas fa-exclamation-triangle"></i></div>
            <h1>Election Not Found</h1>
            <p>The election you're looking for doesn't exist or has been removed.</p>
            <a href="${this.backUrl}" class="btn"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back</a>
          </div>
        `;
      },

      getTotalVotes() {
        return this.candidates.reduce((sum, c) => sum + c.votes, 0);
      },

      getLeadingCandidateName() {
        if (this.candidates.length === 0) return '—';
        return this.candidates[0].name;
      },

      renderCandidatesList() {
        const totalVotes = this.getTotalVotes();
        const isZeroVotes = totalVotes === 0;

        return `
          <div class="candidates-list" role="list" aria-label="Candidates ranked by votes">
            ${this.candidates.map((candidate, index) => this.renderCandidateRow(candidate, index, totalVotes, isZeroVotes)).join('')}
          </div>
          ${isZeroVotes ? '<p class="no-votes-note">No votes have been cast yet.</p>' : ''}
        `;
      },

      renderCandidateRow(candidate, index, totalVotes, isZeroVotes) {
        const rank = index + 1;
        const initial = candidate.name.charAt(0).toUpperCase();
        const percentage = isZeroVotes ? '0.0' : candidate.percentage;
        const isLeader = index === 0;
        const badgeText = this.election.status === 'completed' && isLeader ? 'Winner' : (isLeader ? 'Leading' : '');
        const badgeClass = badgeText ? (this.election.status === 'completed' ? 'badge-winner' : 'badge-leading') : '';
        const barWidth = isZeroVotes ? 0 : parseFloat(percentage);

        return `
          <article class="candidate-row ${isLeader ? 'leader' : ''}" role="listitem" style="--bar-width: ${barWidth}%; --delay: ${index * 100}ms">
            <div class="rank">${rank}</div>
            <div class="candidate-avatar" aria-hidden="true">${initial}</div>
            <div class="candidate-info">
              <div class="candidate-header">
                <h3 class="candidate-name">${this.escapeHtml(candidate.name)}</h3>
                <span class="badge candidate-party">${this.escapeHtml(candidate.party)}</span>
                ${badgeText ? `<span class="badge ${badgeClass}">${badgeText}</span>` : ''}
              </div>
              <div class="vote-details">
                <span class="vote-count">${candidate.votes.toLocaleString()} vote${candidate.votes !== 1 ? 's' : ''}</span>
                <span class="vote-percentage">${percentage}%</span>
              </div>
              <div class="progress-bar-container" aria-hidden="true">
                <div class="progress-bar ${isLeader ? 'leader-bar' : ''}" style="width: 0%; transition-delay: var(--delay)"></div>
              </div>
            </div>
          </article>
        `;
      },

      animateBars() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.querySelectorAll('.progress-bar').forEach(bar => {
            bar.style.width = bar.parentElement.parentElement.style.getPropertyValue('--bar-width') || '0%';
          });
          return;
        }

        requestAnimationFrame(() => {
          document.querySelectorAll('.progress-bar').forEach(bar => {
            const width = bar.parentElement.parentElement.style.getPropertyValue('--bar-width') || '0%';
            bar.style.width = width;
          });
        });
      },

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    };

    document.addEventListener('DOMContentLoaded', () => Results.init());
  </script>
  <style>
    .results-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .results-page .top-bar {
      padding: 1rem 2rem;
    }

    .results-page .top-bar-left {
      gap: 1rem;
    }

    .results-page .top-bar-left .logo {
      justify-content: flex-start;
      margin-bottom: 0;
    }

    .results-page .top-bar-left .logo i {
      font-size: 1.75rem;
    }

    .results-page .top-bar-left .logo span {
      font-size: 1.5rem;
    }

    .btn-back {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      background: transparent;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition), color var(--transition);
      flex-shrink: 0;
      text-decoration: none;
    }

    .btn-back:hover {
      background: rgba(201, 168, 76, 0.1);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-back:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
    }

    .results-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
    }

    @media (min-width: 600px) {
      .results-header {
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
      }
    }

    .results-header-main {
      flex: 1;
    }

    .results-title {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .results-description {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
    }

    .badge-ongoing {
      background: rgba(46, 204, 113, 0.15);
      color: var(--success);
      border: 1px solid rgba(46, 204, 113, 0.3);
    }

    .badge-completed {
      background: rgba(201, 168, 76, 0.15);
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, 0.3);
    }

    .results-stats {
      margin-bottom: 2.5rem;
    }

    .vote-count-section {
      margin-top: 1rem;
    }

    .candidates-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .candidate-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
      position: relative;
    }

    .candidate-row:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
      border-color: rgba(201, 168, 76, 0.3);
    }

    .candidate-row.leader {
      border-color: rgba(201, 168, 76, 0.4);
      box-shadow: 0 0 0 1px rgba(201, 168, 76, 0.1);
    }

    .rank {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .candidate-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), #e8c56d);
      color: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .candidate-row.leader .candidate-avatar {
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
    }

    .candidate-info {
      flex: 1;
      min-width: 0;
    }

    .candidate-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .candidate-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .candidate-party {
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
    }

    .badge-winner {
      background: rgba(201, 168, 76, 0.2);
      color: var(--gold);
      border: 1px solid rgba(201, 168, 76, 0.4);
      font-size: 0.65rem;
    }

    .badge-leading {
      background: rgba(46, 204, 113, 0.2);
      color: var(--success);
      border: 1px solid rgba(46, 204, 113, 0.4);
      font-size: 0.65rem;
    }

    .vote-details {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .vote-count {
      color: var(--text-primary);
      font-weight: 500;
    }

    .vote-percentage {
      color: var(--gold);
      font-weight: 600;
      font-family: 'Playfair Display', serif;
    }

    .progress-bar-container {
      height: 8px;
      background: var(--bg-dark);
      border-radius: 999px;
      overflow: hidden;
      width: 100%;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), #e8c56d);
      border-radius: 999px;
      transition: width 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .progress-bar.leader-bar {
      background: linear-gradient(90deg, #e8c56d, var(--gold), #f0d48a);
      box-shadow: 0 0 12px rgba(201, 168, 76, 0.5);
    }

    .no-votes-note {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 1.5rem;
      padding: 1rem;
      background: rgba(201, 168, 76, 0.05);
      border: 1px dashed rgba(201, 168, 76, 0.2);
      border-radius: 8px;
    }

    .result-screen {
      text-align: center;
      padding: 3rem 1.5rem;
    }

    .result-screen .result-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }

    .result-screen.error .result-icon {
      background: rgba(231, 76, 60, 0.15);
      color: var(--error);
      border: 2px solid var(--error);
    }

    .result-screen h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .result-screen p {
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .empty-message {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .main-content {
        padding: 1.5rem 1rem;
      }

      .results-title {
        font-size: 1.5rem;
      }

      .results-stats {
        grid-template-columns: 1fr;
      }

      .candidate-row {
        padding: 1rem 1.25rem;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .rank {
        width: 36px;
        font-size: 1.25rem;
      }

      .candidate-avatar {
        width: 44px;
        height: 44px;
        font-size: 1.1rem;
      }

      .candidate-header {
        gap: 0.5rem;
      }

      .candidate-name {
        font-size: 1rem;
      }

      .vote-details {
        flex-wrap: wrap;
        gap: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .results-page .top-bar {
        padding: 1rem 1.5rem;
      }

      .results-page .top-bar-left .logo span {
        font-size: 1.25rem;
      }
    }
  </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteSecure - Voter Registration</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="card card-register" role="main">
      <div class="logo" aria-hidden="true">
        <i class="fa-solid fa-check-to-slot"></i>
        <span>VoteSecure</span>
      </div>

      <h1 class="card-title">Voter Registration</h1>
      <p class="card-subtitle">Create your account to participate in elections</p>

      <div class="info-notice" role="alert">
        <i class="fas fa-info-circle" aria-hidden="true"></i>
        <span>After registration, your account will need to be verified by an administrator before you can vote.</span>
      </div>

      <form id="registerForm" novalidate autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <label for="fullName" class="required">Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-user" aria-hidden="true"></i>
              <input type="text" id="fullName" name="fullName" placeholder="Full name" autocomplete="off" required>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="citizenship" class="required">Citizenship No.</label>
            <div class="input-wrapper">
              <i class="fas fa-id-card" aria-hidden="true"></i>
              <input type="text" id="citizenship" name="citizenship" placeholder="Citizenship number" autocomplete="off" required>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="email" class="required">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope" aria-hidden="true"></i>
            <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="off" required>
          </div>
          <div class="error-message" aria-live="polite"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dob" class="required">Date of Birth</label>
            <div class="input-wrapper">
              <i class="fas fa-calendar-alt" aria-hidden="true"></i>
              <input type="date" id="dob" name="dob" autocomplete="off" required>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="phone" class="required">Phone Number</label>
            <div class="input-wrapper">
              <i class="fas fa-phone" aria-hidden="true"></i>
              <input type="tel" id="phone" name="phone" placeholder="Phone number" autocomplete="off" required>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="address" class="required">Address</label>
          <div class="input-wrapper">
            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
            <input type="text" id="address" name="address" placeholder="District, Province" autocomplete="off" required>
          </div>
          <div class="error-message" aria-live="polite"></div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password" class="required">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required minlength="6">
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="required">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock" aria-hidden="true"></i>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" required>
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div class="error-message" aria-live="polite"></div>
          </div>
        </div>

        <button type="submit" class="btn">Register</button>
      </form>

      <p class="footer-links">
        Already have an account? <a href="index.html">Login here</a>
      </p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

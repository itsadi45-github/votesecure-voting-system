<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteSecure - Administrator Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <div class="card" role="main">
      <div class="logo" aria-hidden="true">
        <i class="fa-solid fa-check-to-slot"></i>
        <span>VoteSecure</span>
      </div>

      <h1 class="card-title"><i class="fas fa-shield-alt" aria-hidden="true"></i> Administrator Login</h1>
      <p class="card-subtitle">Access the administration panel</p>

      <form id="adminForm" novalidate autocomplete="off">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fas fa-user-shield" aria-hidden="true"></i>
            <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" required>
          </div>
          <div class="error-message" aria-live="polite"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="new-password" required>
            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
          <div class="error-message" aria-live="polite"></div>
        </div>

        <button type="submit" class="btn">Login to Admin Panel</button>
      </form>

      <div class="hint-box" role="note">
        <i class="fas fa-lightbulb" aria-hidden="true"></i>
        <span>Default: <strong>admin</strong> / <strong>password</strong></span>
      </div>

      <p class="footer-links">
        <a href="index.html"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to Voter Login</a>
      </p>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>

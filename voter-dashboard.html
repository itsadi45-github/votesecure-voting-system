<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoteSecure - Voter Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-header">
        <div class="logo" aria-hidden="true">
          <i class="fa-solid fa-check-to-slot"></i>
          <span>VoteSecure</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="nav-link active" data-page="dashboard"><i class="fas fa-tachometer-alt" aria-hidden="true"></i> Dashboard</a></li>
          <li><a href="#" class="nav-link" data-page="active"><i class="fas fa-vote-yea" aria-hidden="true"></i> Active Elections</a></li>
          <li><a href="#" class="nav-link" data-page="history"><i class="fas fa-history" aria-hidden="true"></i> Voting History</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <div class="user-box">
          <div class="user-avatar" id="userAvatar" aria-hidden="true"></div>
          <div class="user-info">
            <span class="user-name" id="userName"></span>
            <span class="user-role">Registered Voter</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="top-bar" role="banner">
        <div class="top-bar-left">
          <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="sidebar">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <h1 class="page-title">Voter Dashboard</h1>
        </div>
        <div class="top-bar-right">
          <span class="welcome-text" id="welcomeText"></span>
          <button class="btn btn-logout" id="logoutBtn"><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout</button>
        </div>
      </header>

      <main class="main-content" role="main">
        <section class="stats-grid" aria-label="Dashboard statistics">
          <article class="stat-card">
            <div class="stat-icon" aria-hidden="true"><i class="fas fa-vote-yea"></i></div>
            <div class="stat-content">
              <span class="stat-value" id="statActiveElections">0</span>
              <span class="stat-label">Active Elections</span>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon" aria-hidden="true"><i class="fas fa-check-circle"></i></div>
            <div class="stat-content">
              <span class="stat-value" id="statVotesCast">0</span>
              <span class="stat-label">Votes Cast</span>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon" aria-hidden="true"><i class="fas fa-list-alt"></i></div>
            <div class="stat-content">
              <span class="stat-value" id="statTotalElections">0</span>
              <span class="stat-label">Total Elections</span>
            </div>
          </article>
          <article class="stat-card">
            <div class="stat-icon verified" aria-hidden="true"><i class="fa-solid fa-id-card"></i></div>
            <div class="stat-content">
              <span class="stat-value status-verified">Verified</span>
              <span class="stat-label">Account Status</span>
            </div>
          </article>
        </section>

        <section class="elections-section" aria-labelledby="activeElectionsHeading">
          <h2 id="activeElectionsHeading" class="section-title"><i class="fas fa-fire" aria-hidden="true"></i> Active Elections</h2>
          <div class="elections-grid" id="activeElectionsGrid"></div>
          <p class="empty-message" id="activeEmpty" hidden>No active elections at the moment. Check back soon!</p>
        </section>

        <section class="elections-section" aria-labelledby="completedElectionsHeading">
          <h2 id="completedElectionsHeading" class="section-title"><i class="fas fa-archive" aria-hidden="true"></i> Completed Elections</h2>
          <div class="elections-grid" id="completedElectionsGrid"></div>
          <p class="empty-message" id="completedEmpty" hidden>No completed elections yet.</p>
        </section>
      </main>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const Dashboard = {
      voterName: '',
      voterEmail: '',

      init() {
        this.checkAuth();
        this.loadUserInfo();
        this.initSidebar();
        this.initLogout();
        this.renderDashboard();
      },

      checkAuth() {
        this.voterName = sessionStorage.getItem('voterName');
        this.voterEmail = sessionStorage.getItem('voterEmail');
        if (!this.voterName || !this.voterEmail) {
          window.location.href = 'index.html';
        }
      },

      loadUserInfo() {
        const nameEl = document.getElementById('userName');
        const welcomeEl = document.getElementById('welcomeText');
        const avatarEl = document.getElementById('userAvatar');

        if (nameEl) nameEl.textContent = this.voterName;
        if (welcomeEl) welcomeEl.textContent = `Welcome, ${this.voterName}`;
        if (avatarEl) avatarEl.textContent = this.voterName.charAt(0).toUpperCase();
      },

      initSidebar() {
        const hamburger = document.getElementById('hamburger');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const navLinks = document.querySelectorAll('.nav-link');

        hamburger?.addEventListener('click', () => {
          const isOpen = sidebar.classList.toggle('open');
          hamburger.setAttribute('aria-expanded', isOpen);
          overlay.classList.toggle('visible');
        });

        overlay?.addEventListener('click', () => {
          sidebar.classList.remove('open');
          hamburger.setAttribute('aria-expanded', 'false');
          overlay.classList.remove('visible');
        });

        navLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            navLinks.forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            if (window.innerWidth < 768) {
              sidebar.classList.remove('open');
              hamburger.setAttribute('aria-expanded', 'false');
              overlay.classList.remove('visible');
            }
          });
        });
      },

      initLogout() {
        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn?.addEventListener('click', () => {
          sessionStorage.clear();
          window.location.href = 'index.html';
        });
      },

      renderDashboard() {
        const elections = DataStore.getElections();
        const activeElections = elections.filter(e => e.status === 'ongoing');
        const completedElections = elections.filter(e => e.status === 'completed');
        const history = DataStore.getVoterHistory(this.voterEmail);

        document.getElementById('statActiveElections').textContent = activeElections.length;
        document.getElementById('statVotesCast').textContent = history.length;
        document.getElementById('statTotalElections').textContent = elections.length;

        this.renderActiveElections(activeElections);
        this.renderCompletedElections(completedElections);
      },

      renderActiveElections(elections) {
        const grid = document.getElementById('activeElectionsGrid');
        const empty = document.getElementById('activeEmpty');

        if (!elections.length) {
          grid.innerHTML = '';
          empty.hidden = false;
          return;
        }

        empty.hidden = true;
        grid.innerHTML = elections.map(election => {
          const hasVoted = DataStore.hasVoted(this.voterEmail, election.id);
          const endDate = new Date(election.endDate).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });

          return `
            <article class="election-card">
              <div class="election-card-header">
                <h3>${this.escapeHtml(election.title)}</h3>
                ${hasVoted ? '<span class="badge voted">Already Voted</span>' : ''}
              </div>
              <p class="election-description">${this.escapeHtml(election.description)}</p>
              <div class="election-meta">
                <span><i class="fas fa-calendar-alt" aria-hidden="true"></i> Ends: ${endDate}</span>
              </div>
              <div class="election-actions">
                ${hasVoted
                  ? '<button class="btn btn-disabled" disabled><i class="fas fa-check" aria-hidden="true"></i> Already Voted</button>'
                  : `<a href="ballot.html?election=${election.id}" class="btn"><i class="fas fa-vote-yea" aria-hidden="true"></i> Vote Now</a>`
                }
              </div>
            </article>
          `;
        }).join('');
      },

      renderCompletedElections(elections) {
        const grid = document.getElementById('completedElectionsGrid');
        const empty = document.getElementById('completedEmpty');

        if (!elections.length) {
          grid.innerHTML = '';
          empty.hidden = false;
          return;
        }

        empty.hidden = true;
        grid.innerHTML = elections.map(election => {
          const endDate = new Date(election.endDate).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });

          return `
            <article class="election-card completed">
              <div class="election-card-header">
                <h3>${this.escapeHtml(election.title)}</h3>
                <span class="badge completed">Completed</span>
              </div>
              <p class="election-description">${this.escapeHtml(election.description)}</p>
              <div class="election-meta">
                <span><i class="fas fa-calendar-alt" aria-hidden="true"></i> Ended: ${endDate}</span>
              </div>
              <div class="election-actions">
                <a href="results.html?election=${election.id}" class="btn btn-outline"><i class="fas fa-chart-bar" aria-hidden="true"></i> View Results</a>
              </div>
            </article>
          `;
        }).join('');
      },

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    };

    document.addEventListener('DOMContentLoaded', () => Dashboard.init());
  </script>
</body>
</html>
